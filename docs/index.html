<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DICE DICE DICE! — HTML5 Demo</title>
<style>
  :root{
    --bg:#0c0e16; --panel:#1e2433; --panel2:#252c3f; --line:#343d55;
    --gold:#f5c542; --hp:#ff5a5a; --xp:#7a5cff; --wall:#2fa8e0;
    --c-econ:#f5c542; --c-weapon:#ff6b4a; --c-magic:#8f6bff; --c-support:#4caf50; --c-defense:#33c9d6;
    --t0:#b8c0cc; --t1:#4da3ff; --t2:#b96bff; --t3:#ffb830;
  }
  *{box-sizing:border-box; margin:0; padding:0; user-select:none; -webkit-user-select:none;}
  html,body{height:100%; overflow:hidden; background:#000;}
  body{color:#e8ecf5; font-family:"Segoe UI",system-ui,sans-serif; font-size:14px;}

  /* ---------- Stage 1920x1080 cố định, tự scale vừa cửa sổ ---------- */
  #stage{
    position:absolute; top:0; left:0; width:1920px; height:1080px;
    transform-origin:top left; background:var(--bg);
    display:flex; flex-direction:column; overflow:hidden;
  }

  /* ---------- Top bar ---------- */
  #topbar{
    height:64px; flex:0 0 64px;
    display:flex; align-items:center; gap:22px; padding:0 20px;
    background:var(--panel); border-bottom:1px solid var(--line);
  }
  #topbar .stat{display:flex; align-items:center; gap:8px; font-weight:600; font-size:16px;}
  #goldVal{color:var(--gold); font-size:24px; font-weight:800;}
  .barWrap{background:#0d1019; border-radius:6px; height:18px; width:220px; overflow:hidden; position:relative;}
  .barWrap .fill{height:100%; border-radius:6px; transition:width .25s;}
  #hpFill{background:linear-gradient(90deg,#ff5a5a,#ff8a5a);}
  #shieldFill{background:#33c9d6; position:absolute; top:0; left:0; opacity:.85;}
  #xpFill{background:linear-gradient(90deg,#7a5cff,#b96bff);}
  .barWrap .txt{
    position:absolute; inset:0; display:flex; align-items:center; justify-content:center;
    font-size:11px; font-weight:700; color:#fff; text-shadow:0 1px 2px #000;
  }
  #waveLabel{font-size:20px; font-weight:800; letter-spacing:.5px;}
  #phaseLabel{font-size:14px; font-weight:700; color:#9aa4bd;}
  #phaseLabel.combat{color:#ff6b4a;}
  #muteBtn{margin-left:auto;}
  button{
    background:var(--panel2); color:#e8ecf5; border:1px solid var(--line);
    border-radius:8px; padding:8px 14px; cursor:pointer; font-weight:600; font-size:14px;
  }
  button:hover:not(:disabled){background:#303952; border-color:#4a5578;}
  button:disabled{opacity:.45; cursor:not-allowed;}
  button.primary{background:#3a6df0; border-color:#3a6df0;}
  button.primary:hover{background:#5583ff;}

  /* ---------- Chiến trường ---------- */
  #fieldWrap{position:relative; flex:1;}
  canvas{display:block; position:absolute; inset:0;
    background:linear-gradient(#171d2e 0%,#1e2740 62%,#26304e 100%);}
  #banner{
    position:absolute; inset:0; display:flex; flex-direction:column; gap:10px;
    align-items:center; justify-content:flex-start; padding-top:120px; pointer-events:none; z-index:5;
  }
  #banner .big{
    font-size:52px; font-weight:900; letter-spacing:3px; color:#fff;
    text-shadow:0 2px 16px #000; opacity:0; transition:opacity .3s;
  }
  #banner .big.show{opacity:1;}

  /* ---------- Bảng item: 2 cột x 4 hàng, overlay bên trái chiến trường ---------- */
  #board{
    position:absolute; z-index:10;
    display:grid; grid-template-columns:repeat(2,100px); grid-template-rows:repeat(4,100px); gap:10px;
  }
  .slot{
    position:relative; background:#161b28cc; border:3px dashed #503a3a; border-radius:12px;
    display:flex; align-items:center; justify-content:center; cursor:pointer;
  }
  .slot.hasItem{border-style:solid;}
  .slot.selected{outline:3px solid #fff;}
  .slot.dropTarget{background:#20304ccc; border-color:#6fa0ff;}
  .slot .icon{font-size:48px; line-height:1; pointer-events:none;}
  .slot .tierTag{position:absolute; top:4px; left:6px; font-size:11px; font-weight:800; pointer-events:none;}
  .slot .groupDot{position:absolute; top:6px; right:6px; width:10px; height:10px; border-radius:50%; pointer-events:none;}
  .slot .prog{
    position:absolute; left:6px; right:6px; bottom:5px; height:6px; border-radius:3px;
    background:#0d1019; overflow:hidden; pointer-events:none;
  }
  .slot .prog i{display:block; height:100%; width:0%; background:#6fa0ff;}
  .slot.diceSlot .prog i{background:var(--gold);}
  .slot .face{
    position:absolute; inset:0; display:flex; align-items:center; justify-content:center;
    font-size:44px; font-weight:900; color:#fff; text-shadow:0 0 10px var(--gold),0 2px 4px #000;
    opacity:0; pointer-events:none;
  }
  .slot .face.show{animation:facePop .9s ease-out;}
  @keyframes facePop{
    0%{opacity:0; transform:scale(.4);}
    25%{opacity:1; transform:scale(1.5);}
    70%{opacity:1; transform:scale(1);}
    100%{opacity:0; transform:scale(1);}
  }
  .slot.rolling .icon{animation:roll .55s ease-in-out;}
  @keyframes roll{
    0%{transform:translateY(0) rotate(0);}
    30%{transform:translateY(-20px) rotate(200deg);}
    60%{transform:translateY(3px) rotate(360deg);}
    75%{transform:translateY(-8px) rotate(380deg);}
    100%{transform:translateY(0) rotate(360deg);}
  }
  .slot.mergeFlash{animation:mergeFlash .5s;}
  @keyframes mergeFlash{
    0%{box-shadow:0 0 0 0 #fff;}
    40%{box-shadow:0 0 30px 8px #ffe27a;}
    100%{box-shadow:0 0 0 0 transparent;}
  }

  /* ---------- Panel chung ---------- */
  .panel{background:#1e2433ee; border:1px solid var(--line); border-radius:14px; padding:14px;}
  .panelTitle{font-size:13px; font-weight:800; letter-spacing:1px; color:#9aa4bd; margin-bottom:10px; text-transform:uppercase;}

  /* ---------- Info (dưới-trái) ---------- */
  #infoPanel{position:absolute; left:24px; bottom:20px; width:340px; z-index:10;}
  #infoBody{font-size:13px; line-height:1.55; color:#c3cbdf;}
  #infoBody b{color:#fff;}
  #sellBtn{margin-top:10px; width:100%;}

  /* ---------- Shop (phải, chỉ hiện giữa các wave) ---------- */
  #shopPanel{
    position:absolute; right:28px; top:40px; width:430px; z-index:10;
    display:flex; flex-direction:column; gap:0;
  }
  #shopPanel.hidden{display:none;}
  #shopItems{display:flex; flex-direction:column; gap:10px;}
  .shopItem{
    display:flex; align-items:center; gap:12px; background:var(--panel2);
    border:1px solid var(--line); border-radius:12px; padding:12px; cursor:pointer;
  }
  .shopItem:hover{border-color:#6fa0ff;}
  .shopItem.sold{opacity:.35; pointer-events:none;}
  .shopItem .sIcon{font-size:36px;}
  .shopItem .sInfo{flex:1; min-width:0;}
  .shopItem .sName{font-weight:700; font-size:15px;}
  .shopItem .sDesc{font-size:12px; color:#9aa4bd; margin-top:2px;}
  .shopItem .sPrice{font-weight:800; font-size:16px; color:var(--gold); white-space:nowrap;}
  #shopBtns{display:flex; gap:10px; margin-top:12px;}
  #shopBtns button{flex:1;}
  #lockBtn.locked{background:#6b5314; border-color:var(--gold); color:var(--gold);}
  #startWaveBtn{margin-top:14px; width:100%; font-size:18px; padding:14px;}

  /* ---------- Modal ---------- */
  #modal{
    position:fixed; inset:0; background:rgba(8,10,16,.82); display:none;
    align-items:center; justify-content:center; z-index:50; flex-direction:column; gap:18px;
  }
  #modal.show{display:flex;}
  #modalTitle{font-size:30px; font-weight:900; letter-spacing:1px; text-align:center;}
  #modalSub{color:#9aa4bd; margin-top:-10px;}
  #choices{display:flex; gap:16px; flex-wrap:wrap; justify-content:center; max-width:900px;}
  .choice{
    width:250px; background:var(--panel); border:2px solid var(--line); border-radius:14px;
    padding:18px; cursor:pointer; transition:transform .12s, border-color .12s;
  }
  .choice:hover{transform:translateY(-4px); border-color:#6fa0ff;}
  .choice .cIcon{font-size:36px;}
  .choice .cName{font-weight:800; margin:6px 0 4px; font-size:16px;}
  .choice .cGroup{font-size:11px; font-weight:800; letter-spacing:1px; text-transform:uppercase;}
  .choice .cDesc{font-size:13px; color:#b6bfd6; margin-top:6px; line-height:1.45;}
  #endStats{max-width:560px; width:90%; background:var(--panel); border:1px solid var(--line); border-radius:14px; padding:20px; font-size:14px; line-height:1.8;}
  #endStats td{padding:1px 8px;}
  #endStats td:last-child{text-align:right; font-weight:700; color:#fff;}

  /* ---------- Toast & hiệu ứng DOM ---------- */
  #toast{
    position:fixed; top:80px; left:50%; transform:translateX(-50%);
    background:#000c; border:1px solid var(--line); padding:10px 22px; border-radius:22px;
    font-weight:700; font-size:15px; opacity:0; transition:opacity .25s; z-index:60; pointer-events:none;
  }
  .coin{
    position:fixed; z-index:40; font-size:18px; pointer-events:none;
    transition:transform .7s cubic-bezier(.3,-0.2,.6,1), opacity .7s;
  }
  #dragGhost{
    position:fixed; z-index:70; font-size:44px; pointer-events:none; display:none;
    filter:drop-shadow(0 4px 8px #000);
  }
</style>
</head>
<body>

<div id="stage">
  <div id="topbar">
    <div class="stat">🪙 <span id="goldVal">0</span></div>
    <div class="stat">🧱 Tường thành
      <div class="barWrap"><div class="fill" id="hpFill"></div><div class="fill" id="shieldFill" style="width:0%"></div><div class="txt" id="hpTxt"></div></div>
    </div>
    <div class="stat">⭐ Lv.<span id="lvlVal">1</span>
      <div class="barWrap" style="width:160px"><div class="fill" id="xpFill"></div><div class="txt" id="xpTxt"></div></div>
    </div>
    <div id="waveLabel">Wave 0/10</div>
    <div id="phaseLabel">🛒 Giai đoạn mua sắm</div>
    <button id="muteBtn">🔊</button>
  </div>

  <div id="fieldWrap">
    <canvas id="field"></canvas>
    <div id="board"></div>
    <div id="banner"><div class="big" id="bannerText"></div></div>

    <div class="panel" id="infoPanel">
      <div class="panelTitle">Thông tin</div>
      <div id="infoBody"></div>
      <button id="sellBtn" style="display:none"></button>
    </div>

    <div class="panel" id="shopPanel">
      <div class="panelTitle">🛒 Shop — mua sắm trước khi vào wave</div>
      <div id="shopItems"></div>
      <div id="shopBtns">
        <button id="rerollBtn">🔄 Reroll (<span id="rerollCost">2</span>🪙)</button>
        <button id="lockBtn">🔒 Khóa</button>
      </div>
      <button id="startWaveBtn" class="primary">▶ Bắt đầu Wave 1</button>
    </div>
  </div>
</div>

<div id="modal">
  <div id="modalTitle"></div>
  <div id="modalSub"></div>
  <div id="choices"></div>
  <div id="endStats" style="display:none"></div>
  <button id="modalBtn" class="primary" style="display:none; font-size:17px; padding:12px 30px;"></button>
</div>

<div id="toast"></div>
<div id="dragGhost"></div>

<script>
"use strict";
/* =====================================================================
   DICE DICE DICE! — HTML5 demo theo Game Design Spec (MVP, mục 27)
   Bố cục: bảng item 2 cột x 4 hàng bên trái, tường thành kế bên,
   quái từ phải đánh vào tường. Shop chỉ mở giữa các wave. Stage 1920x1080.
   ===================================================================== */

// ---------- Hằng số bố cục ----------
const STAGE_W = 1920, STAGE_H = 1080, TOP_H = 64;
const FIELD_W = STAGE_W, FIELD_H = STAGE_H - TOP_H;   // 1920 x 1016
const SLOT = 100, GAP = 10;
const GRID_X = 24;
const GRID_H = 4*SLOT + 3*GAP;                        // 430
const GRID_Y = Math.floor((FIELD_H - GRID_H)/2);      // căn giữa dọc
const WALL_X = GRID_X + 2*SLOT + GAP + 20;            // tường ngay sau bảng item
const WALL_W = 30;
const STOP_X = WALL_X + WALL_W;                       // quái dừng tại đây

// ---------- Tiện ích ----------
const $ = id => document.getElementById(id);
const rand = (a,b) => a + Math.random()*(b-a);
const randInt = (a,b) => Math.floor(rand(a,b+1));
const clamp = (v,a,b) => Math.max(a,Math.min(b,v));
const pick = arr => arr[Math.floor(Math.random()*arr.length)];

// ---------- Scale stage vừa cửa sổ ----------
const stage = $('stage');
function fitStage(){
  const s = Math.min(window.innerWidth/STAGE_W, window.innerHeight/STAGE_H);
  const ox = (window.innerWidth - STAGE_W*s)/2, oy = (window.innerHeight - STAGE_H*s)/2;
  stage.style.transform = `translate(${ox}px,${oy}px) scale(${s})`;
}
window.addEventListener('resize', fitStage);

// ---------- Âm thanh (WebAudio, synth đơn giản) ----------
let audioCtx = null, muted = false;
function ensureAudio(){ if(!audioCtx) try{ audioCtx = new (window.AudioContext||window.webkitAudioContext)(); }catch(e){} }
function beep(freq, dur, type='sine', vol=0.08, slide=0){
  if(muted || !audioCtx) return;
  const o = audioCtx.createOscillator(), g = audioCtx.createGain();
  o.type = type; o.frequency.value = freq;
  if(slide) o.frequency.linearRampToValueAtTime(freq+slide, audioCtx.currentTime+dur);
  g.gain.value = vol; g.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime+dur);
  o.connect(g); g.connect(audioCtx.destination);
  o.start(); o.stop(audioCtx.currentTime+dur);
}
const SFX = {
  coin:   ()=>{ beep(880,.09,'square',.05); setTimeout(()=>beep(1320,.12,'square',.05),60); },
  roll:   ()=>beep(160,.12,'triangle',.09,-40),
  thud:   ()=>beep(90,.15,'sine',.12),
  buy:    ()=>{ beep(520,.08,'triangle',.08); setTimeout(()=>beep(780,.1,'triangle',.08),70); },
  error:  ()=>beep(140,.2,'sawtooth',.07),
  merge:  ()=>{ beep(440,.09,'sine',.08); setTimeout(()=>beep(660,.09,'sine',.08),80); setTimeout(()=>beep(880,.16,'sine',.09),160); },
  shoot:  ()=>beep(600,.04,'square',.02),
  hit:    ()=>beep(220,.05,'square',.03),
  die:    ()=>beep(300,.12,'sawtooth',.04,-160),
  boom:   ()=>beep(70,.3,'sawtooth',.12,-30),
  lvl:    ()=>{ [523,659,784,1046].forEach((f,i)=>setTimeout(()=>beep(f,.14,'triangle',.09),i*90)); },
  boss:   ()=>{ beep(110,.5,'sawtooth',.12,-20); setTimeout(()=>beep(82,.6,'sawtooth',.12,-10),300); },
  lose:   ()=>{ [392,330,262,196].forEach((f,i)=>setTimeout(()=>beep(f,.25,'triangle',.1),i*180)); },
  win:    ()=>{ [523,659,784,1046,1318].forEach((f,i)=>setTimeout(()=>beep(f,.2,'triangle',.1),i*120)); },
};

// ---------- Định nghĩa item (danh sách MVP mục 27.2) ----------
const TIERS = ['Common','Rare','Epic','Legendary'];
const TIER_COLORS = ['#b8c0cc','#4da3ff','#b96bff','#ffb830'];
const GROUP_COLORS = {econ:'#f5c542', weapon:'#ff6b4a', magic:'#8f6bff', support:'#4caf50', defense:'#33c9d6'};
const GROUP_NAMES  = {econ:'Kinh tế', weapon:'Vũ khí', magic:'Phép thuật', support:'Hỗ trợ', defense:'Phòng thủ'};

const DEFS = {
  dice:     {name:'Dice',          icon:'🎲', group:'econ',    price:10, desc:'Tự roll 1–6 theo thời gian, tạo vàng bằng mặt số. Merge để roll nhanh hơn, số tối thiểu cao hơn, vàng nhân theo phẩm cấp.'},
  bow:      {name:'Bow',           icon:'🏹', group:'weapon',  price:12, dmg:4,  cd:0.8, desc:'Bắn nhanh, sát thương thấp. Epic: xuyên mục tiêu. Legendary: thỉnh thoảng tạo mưa tên.'},
  sword:    {name:'Sword',         icon:'🗡️', group:'weapon', price:14, dmg:9,  cd:1.6, desc:'Kiếm khí chém quái gần tường thành nhất, chém trúng nhiều mục tiêu theo phẩm cấp.'},
  crossbow: {name:'Crossbow',      icon:'🎯', group:'weapon',  price:16, dmg:16, cd:2.4, desc:'Bắn chậm, sát thương lớn, tỉ lệ chí mạng cao. Hiệu quả với Elite và Boss.'},
  cannon:   {name:'Cannon',        icon:'💣', group:'weapon',  price:18, dmg:10, cd:3.0, desc:'Đạn nổ diện rộng, hiệu quả với nhóm quái đông.'},
  firebook: {name:'Fire Book',     icon:'📕', group:'magic',   price:18, dmg:12, cd:4.0, desc:'Gọi cầu lửa nổ diện rộng và gây đốt cháy theo thời gian.'},
  frost:    {name:'Frost Stone',   icon:'❄️', group:'magic',  price:14, dmg:4,  cd:2.5, desc:'Sát thương thấp, làm chậm quái. Epic trở lên có cơ hội đóng băng.'},
  lightning:{name:'Lightning Orb', icon:'⚡', group:'magic',   price:16, dmg:8,  cd:3.0, desc:'Sét lan giữa nhiều mục tiêu đứng gần nhau.'},
  anvil:    {name:'Anvil',         icon:'🔨', group:'support', price:15, desc:'Không tấn công. Tăng sát thương vật lý cho toàn đội hình.'},
  hourglass:{name:'Hourglass',     icon:'⏳', group:'support', price:15, desc:'Không tấn công. Tăng tốc độ đánh của item và tốc độ roll của Dice.'},
  shield:   {name:'Shield',        icon:'🛡️', group:'defense',price:12, desc:'Tạo khiên cho tường thành vào đầu mỗi wave, hấp thụ sát thương trước máu.'},
};

// ---------- Định nghĩa quái (mục 16, 17) ----------
const ENEMY_DEFS = {
  basic:  {name:'Basic',   hp:22,  speed:55, dmg:10, xp:3,  r:18, color:'#c96a4a', icon:'👾'},
  runner: {name:'Runner',  hp:12,  speed:115,dmg:8,  xp:3,  r:14, color:'#e0c74a', icon:'💨'},
  tank:   {name:'Tank',    hp:70,  speed:30, dmg:20, xp:6,  r:24, color:'#8a5adf', icon:'🪨'},
  swarm:  {name:'Swarm',   hp:8,   speed:82, dmg:5,  xp:2,  r:11, color:'#5ad08a', icon:'🐜'},
  armored:{name:'Armored', hp:38,  speed:40, dmg:12, xp:5,  r:19, color:'#9aa4bd', icon:'🛡', physResist:0.5},
  mresist:{name:'M.Resist',hp:38,  speed:40, dmg:12, xp:5,  r:19, color:'#5a8adf', icon:'🔮', magicResist:0.5},
  healer: {name:'Healer',  hp:26,  speed:46, dmg:8,  xp:6,  r:16, color:'#ff8ac8', icon:'✚', healer:true},
  elite:  {name:'ELITE',   hp:230, speed:24, dmg:35, xp:25, r:30, color:'#ff4a6b', icon:'👹', elite:true},
  boss:   {name:'LOADED GOLEM', hp:750, speed:13, dmg:999, xp:60, r:42, color:'#ffb830', icon:'🗿', boss:true, armor:300},
};

// ---------- Trạng thái game ----------
const S = {
  gold:10, baseHp:100, baseMaxHp:100, shield:0,
  xp:0, level:1, wave:0, phase:'prep',      // prep | combat | over
  board:new Array(8).fill(null),
  shop:[], locked:false, rerollCost:2, freeRerollLeft:0,
  enemies:[], projectiles:[], effects:[], spawnQueue:[], waveTime:0,
  paused:false, pendingLevelUps:0,
  chosenUpgrades:[],
  stats:{kills:0, diceGold:0, rolls:0, sixes:0, bought:0, merges:0, dmg:{}},
  mods:{
    diceSpeed:1, diceMin:0, sixBonus:0, doubleRollChance:0, mergeDiceGold:0,
    physDmg:1, atkSpeed:1, critChance:0, pierce:0, critExplode:false,
    magicDmg:1, magicCd:1, dotDuration:1, doubleCast:0,
    supportPower:1,
    sellRate:0.5, freeRerollPerWave:0, waveGold:0, interest:0,
    healPerWave:0, waveShield:0,
  },
};

function makeItem(type){ return {type, tier:0, timer:0, rolling:0, uid:Math.random().toString(36).slice(2)}; }
const tierMult = t => Math.pow(2, t);

// ---------- Nâng cấp roguelike (mục 18) ----------
const UPGRADES = [
  {g:'econ', icon:'🎲', name:'Dice tăng tốc',      desc:'Dice roll nhanh hơn 20%.',                          apply:m=>m.diceSpeed*=1.2},
  {g:'econ', icon:'🎲', name:'Mặt số may mắn',     desc:'Giá trị roll tối thiểu của Dice +1.',               apply:m=>m.diceMin+=1},
  {g:'econ', icon:'🎲', name:'Lộc lá',             desc:'Roll ra 6 nhận thêm 5 vàng.',                       apply:m=>m.sixBonus+=5},
  {g:'econ', icon:'🎲', name:'Roll kép',           desc:'Dice có 25% cơ hội roll hai lần.',                  apply:m=>m.doubleRollChance+=0.25},
  {g:'econ', icon:'🎲', name:'Tinh hoa hợp nhất',  desc:'Mỗi lần merge Dice nhận ngay 10 vàng.',             apply:m=>m.mergeDiceGold+=10},
  {g:'econ', icon:'🪙', name:'Lãi kép',            desc:'Cuối wave nhận lãi 10% số vàng đang giữ (tối đa 15).', apply:m=>m.interest+=0.1},
  {g:'econ', icon:'🪙', name:'Thưởng wave',        desc:'Nhận thêm 10 vàng khi kết thúc mỗi wave.',          apply:m=>m.waveGold+=10},

  {g:'defense', icon:'💚', name:'Tu sửa',          desc:'Hồi 10 máu tường sau mỗi wave.',                    apply:m=>m.healPerWave+=10},

];

// ---------- Hào quang từ item Hỗ trợ ----------
function auras(){
  let phys = 0, speed = 0;
  for(const it of S.board){
    if(!it) continue;
    if(it.type==='anvil')     phys  += 0.15*(it.tier+1)*S.mods.supportPower;
    if(it.type==='hourglass') speed += 0.10*(it.tier+1)*S.mods.supportPower;
  }
  return {phys:1+phys, speed:1+speed};
}

// ---------- DOM refs ----------
const canvas = $('field'), ctx = canvas.getContext('2d');
canvas.width = FIELD_W; canvas.height = FIELD_H;
const boardEl = $('board');
boardEl.style.left = GRID_X+'px';
boardEl.style.top = GRID_Y+'px';

// Tọa độ tâm ô i trên canvas (nguồn bắn projectile)
function slotPos(i){
  const col = i%2, row = Math.floor(i/2);
  return { x: GRID_X + col*(SLOT+GAP) + SLOT/2, y: GRID_Y + row*(SLOT+GAP) + SLOT/2 };
}

// Tạo 8 ô bảng (2 cột x 4 hàng: index 0,1 hàng đầu...)
const slotEls = [];
for(let i=0;i<8;i++){
  const el = document.createElement('div');
  el.className = 'slot'; el.dataset.idx = i;
  el.innerHTML = '<span class="tierTag"></span><span class="groupDot"></span><span class="icon"></span><div class="prog"><i></i></div><div class="face"></div>';
  boardEl.appendChild(el); slotEls.push(el);
}

function toast(msg){
  const t = $('toast'); t.textContent = msg; t.style.opacity = 1;
  clearTimeout(t._h); t._h = setTimeout(()=>t.style.opacity = 0, 1600);
}

// ---------- Render bảng ----------
let selectedSlot = -1;
function renderBoard(){
  S.board.forEach((it, i)=>{
    const el = slotEls[i];
    const icon = el.querySelector('.icon'), tag = el.querySelector('.tierTag'), dot = el.querySelector('.groupDot');
    el.classList.toggle('hasItem', !!it);
    el.classList.toggle('selected', i===selectedSlot);
    el.classList.toggle('diceSlot', !!it && it.type==='dice');
    if(it){
      const d = DEFS[it.type];
      icon.textContent = d.icon;
      icon.style.transform = `scale(${1+it.tier*0.08})`;
      tag.textContent = TIERS[it.tier];
      tag.style.color = TIER_COLORS[it.tier];
      dot.style.background = GROUP_COLORS[d.group];
      el.style.borderColor = TIER_COLORS[it.tier];
      el.style.boxShadow = it.tier>=2 ? `0 0 12px ${TIER_COLORS[it.tier]}55` : 'none';
    } else {
      icon.textContent = ''; tag.textContent = ''; dot.style.background = 'transparent';
      el.style.borderColor = '#503a3a'; el.style.boxShadow = 'none';
      el.querySelector('.prog i').style.width = '0%';
    }
  });
  renderInfo();
}

function itemStatsText(it){
  const d = DEFS[it.type];
  let s = `<b>${d.icon} ${d.name}</b> — <span style="color:${TIER_COLORS[it.tier]}">${TIERS[it.tier]}</span><br>`;
  s += `<span style="color:${GROUP_COLORS[d.group]}">${GROUP_NAMES[d.group]}</span><br>${d.desc}<br>`;
  if(it.type==='dice'){
    const interval = diceInterval(it);
    s += `<br>⏱ Roll mỗi <b>${interval.toFixed(1)}s</b> · Mặt số <b>${diceMin(it)}–6</b> · Vàng = mặt số × <b>${it.tier+1}</b>`;
  } else if(d.dmg){
    s += `<br>⚔ Sát thương <b>${Math.round(effDmg(it))}</b> · ⏱ Cooldown <b>${effCd(it).toFixed(2)}s</b>`;
  } else if(it.type==='shield'){
    s += `<br>🛡 Khiên đầu wave: <b>${15*(it.tier+1)}</b>`;
  } else if(it.type==='anvil'){
    s += `<br>🔨 +${Math.round(15*(it.tier+1)*S.mods.supportPower)}% sát thương vật lý toàn đội`;
  } else if(it.type==='hourglass'){
    s += `<br>⏳ +${Math.round(10*(it.tier+1)*S.mods.supportPower)}% tốc độ toàn đội`;
  }
  return s;
}

function renderInfo(){
  const body = $('infoBody'), sellBtn = $('sellBtn');
  if(selectedSlot>=0 && S.board[selectedSlot]){
    const it = S.board[selectedSlot];
    body.innerHTML = itemStatsText(it);
    if(S.phase==='prep'){
      sellBtn.style.display = 'block';
      sellBtn.textContent = `💰 Bán (${sellPrice(it)}🪙)`;
    } else {
      sellBtn.style.display = 'none';
    }
  } else {
    body.innerHTML = '🎲 <b>Dice tạo vàng</b> — vũ khí và phép tiêu diệt quái!<br><br>· Kéo item vào ô trống để di chuyển.<br>· Kéo 2 item <b>cùng loại + cùng phẩm cấp</b> vào nhau để <b>merge</b>.<br>· Mua sắm giữa các wave, sẵn sàng rồi bấm <b>Bắt đầu Wave</b>.';
    sellBtn.style.display = 'none';
  }
}

function sellPrice(it){ return Math.max(1, Math.floor(DEFS[it.type].price * tierMult(it.tier) * S.mods.sellRate)); }

$('sellBtn').onclick = ()=>{
  if(selectedSlot<0 || !S.board[selectedSlot] || S.phase!=='prep') return;
  const it = S.board[selectedSlot];
  S.gold += sellPrice(it);
  S.board[selectedSlot] = null;
  selectedSlot = -1;
  SFX.coin(); toast('Đã bán item, ô được giải phóng');
  renderBoard(); updateHUD();
};

// ---------- Kéo thả / merge ----------
const ghost = $('dragGhost');
let drag = null;
boardEl.addEventListener('pointerdown', e=>{
  ensureAudio();
  const slot = e.target.closest('.slot'); if(!slot) return;
  const idx = +slot.dataset.idx;
  if(!S.board[idx]){ selectedSlot = -1; renderBoard(); return; }
  drag = {from:idx, sx:e.clientX, sy:e.clientY, moved:false};
  e.preventDefault();
});
window.addEventListener('pointermove', e=>{
  if(!drag) return;
  if(!drag.moved && Math.hypot(e.clientX-drag.sx, e.clientY-drag.sy) > 8){
    drag.moved = true;
    ghost.style.display = 'block';
    ghost.textContent = DEFS[S.board[drag.from].type].icon;
  }
  if(drag.moved){
    ghost.style.left = (e.clientX-22)+'px'; ghost.style.top = (e.clientY-26)+'px';
    slotEls.forEach(el=>el.classList.remove('dropTarget'));
    const t = document.elementFromPoint(e.clientX, e.clientY)?.closest('.slot');
    if(t && +t.dataset.idx !== drag.from) t.classList.add('dropTarget');
  }
});
window.addEventListener('pointerup', e=>{
  if(!drag) return;
  ghost.style.display = 'none';
  slotEls.forEach(el=>el.classList.remove('dropTarget'));
  const {from, moved} = drag; drag = null;
  if(!moved){ // click chọn
    selectedSlot = (selectedSlot===from ? -1 : from);
    renderBoard(); return;
  }
  const t = document.elementFromPoint(e.clientX, e.clientY)?.closest('.slot');
  if(!t) { renderBoard(); return; }
  const to = +t.dataset.idx;
  if(to===from) { renderBoard(); return; }
  const a = S.board[from], b = S.board[to];
  if(!b){ S.board[to] = a; S.board[from] = null; }                    // di chuyển
  else if(b.type===a.type && b.tier===a.tier && a.tier<3){           // MERGE (mục 11)
    const merged = makeItem(a.type); merged.tier = a.tier+1;
    S.board[to] = merged; S.board[from] = null;
    S.stats.merges++;
    if(a.type==='dice' && S.mods.mergeDiceGold){ addGold(S.mods.mergeDiceGold, slotEls[to]); }
    slotEls[to].classList.remove('mergeFlash'); void slotEls[to].offsetWidth;
    slotEls[to].classList.add('mergeFlash');
    SFX.merge();
    toast(`Merge! ${DEFS[a.type].name} → ${TIERS[merged.tier]}`);
  }
  else if(b.type===a.type && b.tier===a.tier && a.tier>=3){ toast('Đã đạt phẩm cấp tối đa (Legendary)'); SFX.error(); }
  else { S.board[to] = a; S.board[from] = b; }                        // hoán đổi
  selectedSlot = -1;
  renderBoard();
});

// ---------- Vàng ----------
function addGold(n, fromEl){
  S.gold += n;
  updateHUD();
  if(fromEl){
    const r1 = fromEl.getBoundingClientRect(), r2 = $('goldVal').getBoundingClientRect();
    for(let i=0;i<Math.min(3,Math.ceil(n/3));i++){
      const c = document.createElement('div');
      c.className = 'coin'; c.textContent = '🪙';
      c.style.left = (r1.left+r1.width/2+rand(-10,10))+'px';
      c.style.top = (r1.top+rand(-6,6))+'px';
      document.body.appendChild(c);
      requestAnimationFrame(()=>{
        c.style.transform = `translate(${r2.left-r1.left-r1.width/2}px, ${r2.top-r1.top}px) scale(.6)`;
        c.style.opacity = '0.2';
      });
      setTimeout(()=>c.remove(), 750);
    }
  }
}

// ---------- Dice ----------
function diceInterval(it){ return Math.max(1.2, (5 - it.tier*0.7) / (S.mods.diceSpeed * auras().speed)); }
function diceMin(it){ return clamp(1 + it.tier + S.mods.diceMin, 1, 6); }
function doDiceRoll(it, idx){
  S.stats.rolls++;
  const face = randInt(diceMin(it), 6);
  if(face===6) S.stats.sixes++;
  let gold = face*(it.tier+1) + (face===6 ? S.mods.sixBonus : 0);
  S.stats.diceGold += gold;
  const el = slotEls[idx];
  const faceEl = el.querySelector('.face');
  faceEl.textContent = face + (face===6?'✨':'');
  faceEl.classList.remove('show'); void faceEl.offsetWidth; faceEl.classList.add('show');
  SFX.thud(); setTimeout(SFX.coin, 150);
  addGold(gold, el);
}

// ---------- Chỉ số chiến đấu ----------
function effDmg(it){
  const d = DEFS[it.type], base = d.dmg * tierMult(it.tier);
  if(d.group==='weapon') return base * S.mods.physDmg * auras().phys;
  if(d.group==='magic')  return base * S.mods.magicDmg;
  return base;
}
function effCd(it){
  const d = DEFS[it.type];
  if(d.group==='weapon') return d.cd / (S.mods.atkSpeed * auras().speed);
  if(d.group==='magic')  return d.cd * S.mods.magicCd / auras().speed;
  return d.cd;
}

// ---------- Sát thương lên quái ----------
function trackDmg(name, amt){ S.stats.dmg[name] = (S.stats.dmg[name]||0) + amt; }
function damageEnemy(en, amt, dmgType, srcName){
  if(en.dead) return;
  let final = amt;
  if(dmgType==='phys'  && en.physResist)  final *= (1-en.physResist);
  if(dmgType==='magic' && en.magicResist) final *= (1-en.magicResist);
  if(en.armor > 0){ // Boss Loaded Golem: lớp giáp hấp thụ trước
    const absorbed = Math.min(en.armor, final);
    en.armor -= absorbed; final -= absorbed;
    if(en.armor<=0) toast('💥 Giáp của Boss đã vỡ!');
  }
  en.hp -= final;
  trackDmg(srcName, Math.round(final));
  en.flash = 0.12;
  SFX.hit();
  if(en.hp<=0) killEnemy(en);
}
function killEnemy(en){
  if(en.dead) return;
  en.dead = true;
  S.stats.kills++;
  S.effects.push({kind:'pop', x:en.x, y:en.y, r:en.r, t:0.35, color:en.color});
  SFX.die();
  gainXp(en.xp);
}

// ---------- XP / Level (mục 18) ----------
function xpNeed(){ return 10 + S.level*10; }
function gainXp(n){
  S.xp += n;
  while(S.xp >= xpNeed()){
    S.xp -= xpNeed(); S.level++; S.pendingLevelUps++;
  }
  if(S.pendingLevelUps>0 && !S.paused) showLevelUp();
  updateHUD();
}
function showLevelUp(){
  S.paused = true; S.pendingLevelUps--;
  SFX.lvl();
  const pool = UPGRADES.filter(u=>!(u.once && S.chosenUpgrades.includes(u.name)));
  const opts = [];
  const cp = pool.slice();
  while(opts.length<3 && cp.length) opts.push(cp.splice(Math.floor(Math.random()*cp.length),1)[0]);
  $('modalTitle').textContent = `⭐ LÊN CẤP ${S.level}!`;
  $('modalSub').textContent = 'Chọn một nâng cấp roguelike — hiệu lực đến hết run.';
  $('endStats').style.display = 'none'; $('modalBtn').style.display = 'none';
  const ch = $('choices'); ch.innerHTML = ''; ch.style.display = 'flex';
  opts.forEach(u=>{
    const el = document.createElement('div');
    el.className = 'choice';
    el.innerHTML = `<div class="cIcon">${u.icon}</div><div class="cGroup" style="color:${GROUP_COLORS[u.g]||'#9aa4bd'}">${GROUP_NAMES[u.g]||u.g}</div><div class="cName">${u.name}</div><div class="cDesc">${u.desc}</div>`;
    el.onclick = ()=>{
      u.apply(S.mods);
      S.chosenUpgrades.push(u.name);
      SFX.buy();
      $('modal').classList.remove('show');
      S.paused = false;
      if(S.pendingLevelUps>0) showLevelUp();
      renderBoard(); updateHUD();
    };
    ch.appendChild(el);
  });
  $('modal').classList.add('show');
}

// ---------- Shop (mục 12) — chỉ mở trong giai đoạn prep ----------
const SHOP_POOL = Object.keys(DEFS);
function rollShop(guaranteeDice){
  S.shop = [];
  const weightFor = t => (t==='dice' ? (S.wave<=3 ? 3 : 1.2) : 1);
  for(let i=0;i<3;i++){
    const bag = [];
    SHOP_POOL.forEach(t=>{ const w = weightFor(t)*10; for(let k=0;k<w;k++) bag.push(t); });
    S.shop.push({type:pick(bag), sold:false});
  }
  if(guaranteeDice && !S.shop.some(s=>s.type==='dice')) S.shop[0] = {type:'dice', sold:false};
  renderShop();
}
function renderShop(){
  const wrap = $('shopItems'); wrap.innerHTML = '';
  S.shop.forEach((s)=>{
    const d = DEFS[s.type];
    const el = document.createElement('div');
    el.className = 'shopItem'+(s.sold?' sold':'');
    el.innerHTML = `<span class="sIcon">${d.icon}</span>
      <span class="sInfo"><span class="sName" style="color:${GROUP_COLORS[d.group]}">${d.name}</span> <span style="font-size:11px;color:var(--t0)">Common · ${GROUP_NAMES[d.group]}</span>
      <div class="sDesc">${d.desc}</div></span>
      <span class="sPrice">${d.price}🪙</span>`;
    el.onclick = ()=>buyItem(s);
    el.onmouseenter = ()=>{ if(selectedSlot<0) $('infoBody').innerHTML = itemStatsText({type:s.type, tier:0}); };
    wrap.appendChild(el);
  });
  $('rerollCost').textContent = S.freeRerollLeft>0 ? '0' : S.rerollCost;
  $('lockBtn').classList.toggle('locked', S.locked);
  $('lockBtn').textContent = S.locked ? '🔒 Đã khóa' : '🔒 Khóa';
}
function buyItem(s){
  ensureAudio();
  if(S.phase!=='prep'){ toast('Chỉ mua được giữa các wave!'); SFX.error(); return; }
  const d = DEFS[s.type];
  if(s.sold) return;
  if(S.gold < d.price){ toast('Không đủ vàng!'); SFX.error(); return; }
  const empty = S.board.findIndex(x=>!x);
  if(empty<0){ toast('⚠️ Bảng đã đầy 8 ô! Hãy merge hoặc bán bớt item.'); SFX.error(); return; }
  S.gold -= d.price;
  S.board[empty] = makeItem(s.type);
  s.sold = true;
  S.stats.bought++;
  SFX.buy();
  renderShop(); renderBoard(); updateHUD();
}
$('rerollBtn').onclick = ()=>{
  ensureAudio();
  if(S.phase!=='prep') return;
  const cost = S.freeRerollLeft>0 ? 0 : S.rerollCost;
  if(S.gold < cost){ toast('Không đủ vàng để reroll!'); SFX.error(); return; }
  if(S.freeRerollLeft>0) S.freeRerollLeft--; else { S.gold -= cost; S.rerollCost++; }
  S.locked = false;
  rollShop(false);
  SFX.buy(); updateHUD();
};
$('lockBtn').onclick = ()=>{ S.locked = !S.locked; renderShop(); };

function setPhaseUI(){
  const prep = S.phase==='prep';
  $('shopPanel').classList.toggle('hidden', !prep);
  const pl = $('phaseLabel');
  pl.textContent = prep ? '🛒 Giai đoạn mua sắm' : '⚔️ Wave đang diễn ra!';
  pl.classList.toggle('combat', !prep);
  renderInfo();
}

// ---------- Wave (mục 15, 16, 17) ----------
function waveSpawns(w){
  const L = []; const add = (type,n,gap,start)=>{ for(let i=0;i<n;i++) L.push({t:start+i*gap, type}); };
  switch(w){
    case 1: add('basic',5,2.2,1); break;
    case 2: add('basic',8,1.7,1); add('runner',2,3,14); break;
    case 3: add('runner',6,1.4,1); add('basic',6,2,4); break;
    case 4: add('swarm',12,0.5,1); add('basic',6,2,8); add('runner',4,1.5,15); break;
    case 5: add('basic',6,1.8,1); add('tank',2,5,6); add('elite',1,0,20); break; // mini-boss
    case 6: add('armored',5,3,1); add('basic',8,1.5,3); add('runner',4,1.2,16); break;
    case 7: add('mresist',5,3,1); add('swarm',14,0.45,5); add('tank',2,6,12); break;
    case 8: add('healer',2,8,4); add('armored',4,3.2,1); add('mresist',4,3.2,2.5); add('basic',10,1.4,6); break;
    case 9: add('tank',4,4,1); add('runner',8,1,3); add('healer',2,7,8); add('swarm',12,0.5,12); add('elite',1,0,24); break;
    case 10: add('swarm',8,0.6,2); add('basic',6,2.5,6); add('boss',1,0,10); add('runner',6,1.5,26); break;
  }
  return L.sort((a,b)=>a.t-b.t);
}
function hpMul(w){ return 1 + 0.28*(w-1); }

function startWave(){
  if(S.phase!=='prep' || S.wave>=10) return;
  S.wave++;
  S.spawnQueue = waveSpawns(S.wave);
  S.waveTime = 0;
  S.phase = 'combat';
  // Khiên đầu wave: item Shield + nâng cấp
  let sh = S.mods.waveShield;
  for(const it of S.board) if(it && it.type==='shield') sh += 15*(it.tier+1);
  S.shield = sh;
  S.rerollCost = 2;
  S.freeRerollLeft = S.mods.freeRerollPerWave;
  selectedSlot = -1;
  setPhaseUI(); renderBoard();
  showBanner(S.wave===10 ? '☠️ BOSS: LOADED GOLEM' : (S.wave===5 ? '⚠️ Wave 5 — MINI-BOSS' : `Wave ${S.wave}`));
  if(S.wave===10||S.wave===5) SFX.boss();
  updateHUD();
}
function endWave(){
  S.phase = 'prep';
  // Thưởng cuối wave (mục 7.1)
  let bonus = 5 + S.mods.waveGold;
  if(S.mods.interest>0) bonus += Math.min(15, Math.floor(S.gold*S.mods.interest));
  addGold(bonus, $('waveLabel'));
  if(S.mods.healPerWave) S.baseHp = Math.min(S.baseMaxHp, S.baseHp + S.mods.healPerWave);
  if(!S.locked) rollShop(false); else { S.locked = false; renderShop(); }
  if(S.wave>=10){ gameOver(true); return; }
  showBanner(`✅ Wave ${S.wave} hoàn thành! +${bonus}🪙`);
  $('startWaveBtn').textContent = `▶ Bắt đầu Wave ${S.wave+1}`;
  setPhaseUI();
  updateHUD();
}
$('startWaveBtn').onclick = ()=>{ ensureAudio(); startWave(); };

function showBanner(text){
  const b = $('bannerText');
  b.textContent = text; b.classList.add('show');
  clearTimeout(b._h); b._h = setTimeout(()=>b.classList.remove('show'), 2200);
}

// ---------- Quái ----------
function spawnEnemy(type){
  const d = ENEMY_DEFS[type];
  const m = d.boss||d.elite ? 1 + 0.15*(S.wave-1) : hpMul(S.wave);
  const en = {
    type, name:d.name, icon:d.icon, color:d.color, r:d.r,
    x:FIELD_W + 40, y:rand(110, FIELD_H-90),
    hp:d.hp*m, maxHp:d.hp*m, speed:d.speed*(1+0.03*(S.wave-1)), dmg:d.dmg,
    xp:d.xp, physResist:d.physResist||0, magicResist:d.magicResist||0,
    healer:d.healer||false, elite:d.elite||false, boss:d.boss||false,
    armor:d.armor||0, maxArmor:d.armor||0,
    slow:0, freeze:0, dots:[], flash:0, dead:false, healT:0, wob:rand(0,6.28),
  };
  S.enemies.push(en);
}

// ---------- Tấn công của item ----------
function nearestEnemy(){ let best=null,bx=1e9; for(const e of S.enemies){ if(!e.dead && e.x<bx){bx=e.x;best=e;} } return best; }
function fireItem(it, idx){
  const d = DEFS[it.type];
  const target = nearestEnemy();
  if(!target) return false;
  const origin = slotPos(idx);
  const dmg = effDmg(it);
  const name = d.name;
  const isCrit = ()=> Math.random() < ((it.type==='crossbow' ? 0.3+0.05*it.tier : 0.05) + S.mods.critChance);

  const castOnce = ()=>{
    switch(it.type){
      case 'bow': {
        const pierce = (it.tier>=2?1:0) + (it.tier>=3?1:0) + S.mods.pierce;
        S.projectiles.push({kind:'arrow', x:origin.x, y:origin.y, tgt:target, speed:520, dmg, dtype:'phys', name, pierce, hit:new Set()});
        if(it.tier>=3 && Math.random()<0.15){ // Legendary: mưa tên
          for(let i=0;i<5;i++){
            const t2 = pick(S.enemies.filter(e=>!e.dead)) || target;
            S.projectiles.push({kind:'arrow', x:rand(STOP_X+100,FIELD_W-100), y:-10, tgt:t2, speed:600, dmg:dmg*0.6, dtype:'phys', name, pierce:0, hit:new Set()});
          }
          showBanner('🏹 MƯA TÊN!');
        }
        SFX.shoot();
        break;
      }
      case 'sword': {
        // Kiếm khí: chém ngay các mục tiêu gần tường thành nhất
        const targets = S.enemies.filter(e=>!e.dead).sort((a,b)=>a.x-b.x).slice(0, 1+it.tier);
        targets.forEach(e=>{
          const crit = isCrit();
          damageEnemy(e, dmg*(crit?2:1), 'phys', name);
          S.effects.push({kind:'slash', x:e.x, y:e.y, t:0.25});
          if(crit && S.mods.critExplode) aoeDamage(e.x, e.y, 50, dmg*0.5, 'phys', name);
        });
        SFX.shoot();
        break;
      }
      case 'crossbow': {
        const crit = isCrit();
        S.projectiles.push({kind:'bolt', x:origin.x, y:origin.y, tgt:target, speed:680, dmg:dmg*(crit?2.5:1), crit, dtype:'phys', name, pierce:(it.tier>=3?2:0)+S.mods.pierce, hit:new Set()});
        SFX.shoot();
        break;
      }
      case 'cannon': {
        S.projectiles.push({kind:'shell', x:origin.x, y:origin.y, tgt:target, speed:380, dmg, dtype:'phys', name, aoe:70+12*it.tier});
        SFX.shoot();
        break;
      }
      case 'firebook': {
        // Thiên thạch rơi xuống mục tiêu
        S.projectiles.push({kind:'meteor', x:target.x+rand(-10,10), y:-20, tgt:target, speed:460, dmg, dtype:'magic', name, aoe:75+12*it.tier, burn:3*(it.tier+1)});
        break;
      }
      case 'frost': {
        S.projectiles.push({kind:'frost', x:origin.x, y:origin.y, tgt:target, speed:460, dmg, dtype:'magic', name,
          slowDur:2*S.mods.dotDuration, freeze:(it.tier>=2 && Math.random()<0.2) ? 1*S.mods.dotDuration : 0});
        break;
      }
      case 'lightning': {
        // Sét lan tức thời
        let cur = target; const chained = new Set(); let n = 3+it.tier; let lastX=origin.x, lastY=origin.y;
        while(cur && n-->0){
          chained.add(cur);
          damageEnemy(cur, dmg, 'magic', name);
          S.effects.push({kind:'bolt', x1:lastX, y1:lastY, x2:cur.x, y2:cur.y, t:0.18});
          lastX=cur.x; lastY=cur.y;
          cur = S.enemies.find(e=>!e.dead && !chained.has(e) && Math.hypot(e.x-lastX,e.y-lastY)<130);
        }
        beep(1200,.08,'sawtooth',.04,-400);
        break;
      }
    }
  };
  castOnce();
  if(d.group==='magic' && Math.random()<S.mods.doubleCast) setTimeout(()=>{ if(S.phase==='combat') castOnce(); }, 200);
  return true;
}
function aoeDamage(x,y,r,dmg,dtype,name,burn){
  S.effects.push({kind:'boom', x, y, r, t:0.35});
  for(const e of S.enemies){
    if(e.dead) continue;
    if(Math.hypot(e.x-x, e.y-y) <= r+e.r){
      damageEnemy(e, dmg, dtype, name);
      if(burn) e.dots.push({dps:burn, t:3*S.mods.dotDuration});
    }
  }
  SFX.boom();
}

// ---------- Vòng lặp chính ----------
let lastT = performance.now();
function loop(now){
  const dt = clamp((now-lastT)/1000, 0, 0.05);
  lastT = now;
  if(!S.paused && S.phase!=='over') update(dt);
  draw();
  requestAnimationFrame(loop);
}

function update(dt){
  // --- Item trên bảng (Dice chỉ roll khi wave đang diễn ra) ---
  S.board.forEach((it, i)=>{
    if(!it) return;
    const el = slotEls[i];
    if(it.type==='dice'){
      const interval = diceInterval(it);
      if(it.rolling>0){ // cho roll đang dở hoàn tất kể cả khi wave vừa kết thúc
        it.rolling -= dt;
        if(it.rolling<=0){ el.classList.remove('rolling'); doDiceRoll(it, i); it.timer = 0; }
      } else if(S.phase==='combat'){
        it.timer += dt;
        el.querySelector('.prog i').style.width = clamp(it.timer/interval*100,0,100)+'%';
        if(it.timer >= interval){
          it.rolling = 0.55;
          el.classList.add('rolling');
          SFX.roll();
        }
      }
    } else if(DEFS[it.type].dmg){
      const cd = effCd(it);
      it.timer += dt;
      el.querySelector('.prog i').style.width = clamp(it.timer/cd*100,0,100)+'%';
      if(it.timer >= cd && S.phase==='combat'){
        if(fireItem(it, i)) it.timer = 0;
      }
    } else {
      el.querySelector('.prog i').style.width = '0%';
    }
  });

  if(S.phase==='combat'){
    // --- Spawn ---
    S.waveTime += dt;
    while(S.spawnQueue.length && S.spawnQueue[0].t <= S.waveTime){
      spawnEnemy(S.spawnQueue.shift().type);
    }
    // --- Quái ---
    for(const e of S.enemies){
      if(e.dead) continue;
      e.flash = Math.max(0, e.flash-dt);
      e.wob += dt*6;
      // DoT
      for(const dot of e.dots){ dot.t -= dt; if(!e.dead) { e.hp -= dot.dps*dt; } }
      e.dots = e.dots.filter(d=>d.t>0);
      if(e.hp<=0 && !e.dead){ trackDmg('Đốt/Độc', 1); killEnemy(e); continue; }
      // Slow / freeze
      let spd = e.speed;
      if(e.freeze>0){ e.freeze -= dt; spd = 0; }
      else if(e.slow>0){ e.slow -= dt; spd *= 0.55; }
      e.x -= spd*dt;
      // Healer
      if(e.healer){
        e.healT += dt;
        if(e.healT>1){
          e.healT = 0;
          for(const o of S.enemies){
            if(!o.dead && o!==e && Math.hypot(o.x-e.x,o.y-e.y)<110){ o.hp = Math.min(o.maxHp, o.hp+3*hpMul(S.wave)); }
          }
          S.effects.push({kind:'heal', x:e.x, y:e.y, t:0.4});
        }
      }
      // Chạm tường thành
      if(e.x <= STOP_X + e.r){
        e.dead = true;
        let dmg = e.dmg;
        if(S.shield>0){ const ab = Math.min(S.shield, dmg); S.shield -= ab; dmg -= ab; }
        S.baseHp -= dmg;
        S.effects.push({kind:'baseHit', t:0.4, y:e.y});
        SFX.boom();
        updateHUD();
        if(S.baseHp<=0){ S.baseHp = 0; updateHUD(); gameOver(false); return; }
      }
    }
    S.enemies = S.enemies.filter(e=>!e.dead);
    // --- Projectile ---
    for(const p of S.projectiles){
      if(p.done) continue;
      if(p.kind==='meteor'){
        p.y += p.speed*dt;
        const ty = p.tgt && !p.tgt.dead ? p.tgt.y : FIELD_H-100;
        if(p.y >= ty){ aoeDamage(p.x, ty, p.aoe, p.dmg, 'magic', p.name, p.burn); p.done = true; }
        continue;
      }
      let tx, ty;
      if(p.tgt && !p.tgt.dead){ tx = p.tgt.x; ty = p.tgt.y; }
      else {
        const nt = nearestEnemy();
        if(nt && p.pierce!==undefined){ p.tgt = nt; tx = nt.x; ty = nt.y; }
        else { tx = p.x + 100; ty = p.y; }
      }
      const dx = tx-p.x, dy = ty-p.y, dist = Math.hypot(dx,dy)||1;
      p.x += dx/dist*p.speed*dt; p.y += dy/dist*p.speed*dt;
      p.angle = Math.atan2(dy,dx);
      if(p.x > FIELD_W+60 || p.x < -30 || p.y > FIELD_H+40){ p.done = true; continue; }
      // Va chạm
      for(const e of S.enemies){
        if(e.dead || (p.hit && p.hit.has(e))) continue;
        if(Math.hypot(e.x-p.x, e.y-p.y) < e.r+8){
          if(p.kind==='shell'){ aoeDamage(p.x, p.y, p.aoe, p.dmg, p.dtype, p.name); p.done = true; break; }
          if(p.kind==='frost'){
            damageEnemy(e, p.dmg, 'magic', p.name);
            e.slow = Math.max(e.slow, p.slowDur);
            if(p.freeze) e.freeze = Math.max(e.freeze, p.freeze);
            S.effects.push({kind:'frost', x:e.x, y:e.y, t:0.3});
            p.done = true; break;
          }
          damageEnemy(e, p.dmg, p.dtype, p.name);
          if(p.crit){ S.effects.push({kind:'crit', x:e.x, y:e.y-18, t:0.5});
            if(S.mods.critExplode) aoeDamage(e.x, e.y, 50, p.dmg*0.4, 'phys', p.name);
          }
          if(p.hit) p.hit.add(e);
          if(p.pierce>0){ p.pierce--; p.tgt = null; }
          else { p.done = true; }
          break;
        }
      }
    }
    S.projectiles = S.projectiles.filter(p=>!p.done);
    // --- Wave hoàn thành ---
    if(!S.spawnQueue.length && !S.enemies.length && S.phase==='combat'){
      endWave();
    }
  }
  // --- Hiệu ứng ---
  for(const f of S.effects) f.t -= dt;
  S.effects = S.effects.filter(f=>f.t>0);
}

// ---------- Vẽ ----------
function draw(){
  const W = FIELD_W, H = FIELD_H;
  ctx.clearRect(0,0,W,H);
  // Nền đất
  ctx.fillStyle = '#2b3450';
  ctx.fillRect(0, H-46, W, 46);
  ctx.strokeStyle = '#3d4a6e'; ctx.lineWidth = 1;
  for(let x=0;x<W;x+=64){ ctx.beginPath(); ctx.moveTo(x,H-46); ctx.lineTo(x+24,H); ctx.stroke(); }
  // Khu vực bảng item (nền sau lưới DOM)
  ctx.fillStyle = '#12182688';
  ctx.fillRect(0, 0, WALL_X, H);

  // ---- Tường thành (xanh) ----
  const bhit = S.effects.find(f=>f.kind==='baseHit');
  ctx.save();
  if(bhit) ctx.translate(rand(-4,4), 0);
  // Thân tường
  const grd = ctx.createLinearGradient(WALL_X, 0, WALL_X+WALL_W, 0);
  grd.addColorStop(0, '#1d7fb0'); grd.addColorStop(0.5, '#2fa8e0'); grd.addColorStop(1, '#1d7fb0');
  ctx.fillStyle = grd;
  ctx.fillRect(WALL_X, 24, WALL_W, H-24);
  // Đỉnh tường
  ctx.fillStyle = '#2fa8e0';
  ctx.fillRect(WALL_X-4, 24, WALL_W+8, 12);
  ctx.fillStyle = '#1d7fb0';
  for(let yy=60; yy<H-30; yy+=70){ ctx.fillRect(WALL_X+4, yy, WALL_W-8, 8); }
  // Vết nứt khi máu thấp
  if(S.baseHp/S.baseMaxHp < 0.4){
    ctx.strokeStyle = '#0d3448'; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(WALL_X+6, H*0.3); ctx.lineTo(WALL_X+WALL_W-6, H*0.38); ctx.lineTo(WALL_X+8, H*0.46); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(WALL_X+WALL_W-8, H*0.62); ctx.lineTo(WALL_X+6, H*0.72); ctx.stroke();
  }
  // Khiên bao tường
  if(S.shield>0){
    ctx.strokeStyle = '#33c9d6'; ctx.lineWidth = 4; ctx.globalAlpha = 0.6;
    ctx.beginPath(); ctx.moveTo(STOP_X+10, 20); ctx.quadraticCurveTo(STOP_X+26, H/2, STOP_X+10, H-20); ctx.stroke();
    ctx.globalAlpha = 1;
  }
  // Hit flash trên tường
  if(bhit){
    ctx.fillStyle = '#ff5a5a66';
    ctx.fillRect(WALL_X, 24, WALL_W, H-24);
  }
  ctx.restore();

  // Quái
  for(const e of S.enemies){
    if(e.dead) continue;
    const bob = Math.sin(e.wob)*2.5;
    ctx.save();
    ctx.translate(e.x, e.y+bob);
    ctx.fillStyle = e.flash>0 ? '#ffffff' : e.color;
    ctx.beginPath(); ctx.arc(0, 0, e.r, 0, 6.29); ctx.fill();
    if(e.freeze>0){ ctx.fillStyle = '#a8e8ff88'; ctx.beginPath(); ctx.arc(0,0,e.r+4,0,6.29); ctx.fill(); }
    else if(e.slow>0){ ctx.strokeStyle = '#7ad0ff'; ctx.lineWidth = 3; ctx.beginPath(); ctx.arc(0,0,e.r+3,0,6.29); ctx.stroke(); }
    if(e.dots.length){ ctx.fillStyle = '#ff6b2088'; ctx.beginPath(); ctx.arc(0,-e.r*0.6,5,0,6.29); ctx.fill(); }
    ctx.font = `${Math.round(e.r*1.15)}px serif`; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText(e.icon, 0, 1);
    // HP bar
    const bw = e.r*2;
    ctx.fillStyle = '#0d1019'; ctx.fillRect(-bw/2, -e.r-13, bw, 6);
    ctx.fillStyle = e.boss ? '#ffb830' : (e.elite ? '#ff4a6b' : '#5ad08a');
    ctx.fillRect(-bw/2, -e.r-13, bw*clamp(e.hp/e.maxHp,0,1), 6);
    if(e.armor>0){
      ctx.fillStyle = '#c8d2e8'; ctx.fillRect(-bw/2, -e.r-20, bw*clamp(e.armor/e.maxArmor,0,1), 5);
    }
    if(e.boss||e.elite){
      ctx.font = 'bold 13px sans-serif'; ctx.fillStyle = '#fff';
      ctx.fillText(e.name, 0, -e.r-30);
    }
    ctx.restore();
  }
  // Projectile
  for(const p of S.projectiles){
    ctx.save(); ctx.translate(p.x, p.y);
    switch(p.kind){
      case 'arrow':
        ctx.rotate(p.angle||0);
        ctx.strokeStyle = '#ffd27a'; ctx.lineWidth = 3;
        ctx.beginPath(); ctx.moveTo(-10,0); ctx.lineTo(10,0); ctx.stroke();
        ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.moveTo(10,0); ctx.lineTo(4,-4); ctx.lineTo(4,4); ctx.fill();
        break;
      case 'bolt':
        ctx.rotate(p.angle||0);
        ctx.strokeStyle = p.crit ? '#ff5a5a' : '#ffe8b0'; ctx.lineWidth = 4;
        ctx.beginPath(); ctx.moveTo(-11,0); ctx.lineTo(11,0); ctx.stroke();
        break;
      case 'shell':
        ctx.fillStyle = '#3a3f52'; ctx.beginPath(); ctx.arc(0,0,8,0,6.29); ctx.fill();
        ctx.strokeStyle = '#ff9c4a'; ctx.stroke();
        break;
      case 'meteor':
        ctx.fillStyle = '#ff7a3c'; ctx.beginPath(); ctx.arc(0,0,10,0,6.29); ctx.fill();
        ctx.strokeStyle = '#ffd27a'; ctx.lineWidth = 3;
        ctx.beginPath(); ctx.moveTo(0,-20); ctx.lineTo(0,-8); ctx.stroke();
        break;
      case 'frost':
        ctx.fillStyle = '#a8e8ff'; ctx.beginPath(); ctx.arc(0,0,7,0,6.29); ctx.fill();
        break;
    }
    ctx.restore();
  }
  // Hiệu ứng
  for(const f of S.effects){
    ctx.save();
    switch(f.kind){
      case 'boom': {
        const pr = 1-(f.t/0.35);
        ctx.globalAlpha = 1-pr;
        ctx.strokeStyle = '#ff9c4a'; ctx.lineWidth = 5;
        ctx.beginPath(); ctx.arc(f.x, f.y, f.r*pr, 0, 6.29); ctx.stroke();
        ctx.fillStyle = '#ffd27a33'; ctx.fill();
        break;
      }
      case 'pop': {
        const pr = 1-(f.t/0.35);
        ctx.globalAlpha = 1-pr;
        ctx.fillStyle = f.color;
        for(let i=0;i<5;i++){
          const ang = i/5*6.29;
          ctx.beginPath();
          ctx.arc(f.x+Math.cos(ang)*f.r*2*pr, f.y+Math.sin(ang)*f.r*2*pr, 4*(1-pr), 0, 6.29);
          ctx.fill();
        }
        break;
      }
      case 'slash': {
        ctx.globalAlpha = f.t/0.25;
        ctx.strokeStyle = '#fff'; ctx.lineWidth = 4;
        ctx.beginPath(); ctx.moveTo(f.x-18, f.y-18); ctx.lineTo(f.x+18, f.y+18); ctx.stroke();
        ctx.beginPath(); ctx.moveTo(f.x+14, f.y-20); ctx.lineTo(f.x-14, f.y+20); ctx.stroke();
        break;
      }
      case 'bolt': {
        ctx.globalAlpha = f.t/0.18;
        ctx.strokeStyle = '#ffe86b'; ctx.lineWidth = 3;
        ctx.beginPath(); ctx.moveTo(f.x1, f.y1);
        const mx = (f.x1+f.x2)/2 + rand(-14,14), my = (f.y1+f.y2)/2 + rand(-14,14);
        ctx.lineTo(mx, my); ctx.lineTo(f.x2, f.y2); ctx.stroke();
        break;
      }
      case 'frost': {
        ctx.globalAlpha = f.t/0.3;
        ctx.strokeStyle = '#a8e8ff'; ctx.lineWidth = 3;
        ctx.beginPath(); ctx.arc(f.x, f.y, 22*(1-f.t/0.3)+8, 0, 6.29); ctx.stroke();
        break;
      }
      case 'heal': {
        ctx.globalAlpha = f.t/0.4;
        ctx.fillStyle = '#ff8ac8'; ctx.font = 'bold 17px sans-serif'; ctx.textAlign = 'center';
        ctx.fillText('✚', f.x, f.y - (0.4-f.t)*30 - 24);
        break;
      }
      case 'crit': {
        ctx.globalAlpha = f.t/0.5;
        ctx.fillStyle = '#ff5a5a'; ctx.font = 'bold 15px sans-serif'; ctx.textAlign = 'center';
        ctx.fillText('CRIT!', f.x, f.y - (0.5-f.t)*26);
        break;
      }
    }
    ctx.restore();
  }
}

    <div style="line-height:1.9">
    🧱 Bảo vệ <b style="color:var(--wall)">tường thành</b> — quái tiến vào từ bên phải.<br>
    🎲 <b style="color:var(--gold)">Dice tạo vàng</b> (tự roll như Sunflower trong PvZ) — <b style="color:var(--c-weapon)">vũ khí và phép thuật tiêu diệt quái</b>.<br>
    🛒 <b>Mua sắm giữa các wave</b> — sẵn sàng rồi bấm <b>Bắt đầu Wave</b>. Bảng chỉ có <b>8 ô</b>!<br>
    🔀 Kéo 2 item giống nhau + cùng phẩm cấp vào nhau để <b>merge</b> lên phẩm cấp cao hơn và giải phóng ô.<br>
    ⭐ Diệt quái nhận XP — lên cấp chọn 1 trong 3 nâng cấp roguelike.<br>
    🏆 Sống sót 10 wave và hạ Boss <b>Loaded Golem</b> để chiến thắng!
    </div>`;
  const btn = $('modalBtn');
  btn.style.display = 'block'; btn.textContent = '▶ Vào game';
  btn.onclick = ()=>{
    ensureAudio();
    $('modal').classList.remove('show');
    st.style.display = 'none'; btn.style.display = 'none';

    S.paused = false;
  };

}
